 * KVRaft proto文件
 * Raft算法达成共识需要的服务
*/
syntax = "proto3";
package kvraft;
option cc_generic_services = true;

//服务器名字列表
message Servers{
    repeated string serversName=1;
}
//命令类型
message Command{
    bytes type = 1;     //命令类型
    bytes clientid = 2;
    int64 requestid = 3;

    //Put、Get、Append
    bytes key = 4;
    bytes value = 5;
    
    //Query
    int64 num = 6;

    //Join
    map<int64,Servers> groups = 7;

    //Leave
    repeated int64 gids = 8;

    //Move
    int64 shard = 9;
    int64 gid = 10;
}

//日志类型
message LogEntry{
    Command command = 1;    //命令
    int64 term = 2; 
}

//追加日志消息类型
message AppendEntriesRequest{
    int64 term = 1;               
    string leaderid = 2;  
    int64 leaderCommit = 3;  
    int64 preLogIndex = 4;     
    int64 preLogTerm = 5;      
    repeated LogEntry logEntries = 6;
} 
message AppendEntriesResponse{
    int64 term = 1;
    bool success = 2;
    int64 fastback = 3;
}

//下载快照消息类型
message InstallSnapshotRequest{
    int64 term = 1;
    string leaderid = 2;
    int64 lastIncludeIndex = 3;
    int64 lastIncludeTerm = 4;
    bytes data = 5;

    int64 offset = 6;
    bool done = 7;
}
message InstallSnapshotResponse{
    int64 term = 1; 
}

//请求投票消息类型
message RequestVoteRequest{
    int64 term = 1;
    string candidateid = 2;
    int64 lastLogIndex = 3;
    int64 lastLogTerm = 4;
}

message RequestVoteResponse{
    int64 term = 1;
    bool VoteGranted = 2;
}

service KVRaftRPC{
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
    rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
    rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}